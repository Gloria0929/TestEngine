<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestEngine 测试平台 · 静态预览</title>

  <!-- Element Plus -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css" />
  <!-- Element Plus dark mode css vars -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/theme-chalk/dark/css-vars.css" />

  <style>
    :root {
      --accent: #0d9488;
      --accent-strong: #0f766e;
      --accent-soft: #ccfbf1;
      --accent-soft-2: #f0fdfa;

      --sb-bg: #0f172a;
      --sb-bg-2: #1e293b;
      --sb-text: #7c8aa5;
      --sb-text-hover: #cbd5e1;
      --sb-text-active: #f1f5f9;
      --sb-border: #1e293b;

      --app-bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e5e7eb;
      --border-2: #eef0f3;
      --text-1: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;

      --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.05);
      --shadow-md: 0 6px 18px rgba(15,23,42,.06), 0 2px 6px rgba(15,23,42,.04);
      --radius: 10px;
      --radius-sm: 8px;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

      --el-color-primary: #0d9488;
      --el-color-primary-light-3: #43a99e;
      --el-color-primary-light-5: #6fbfb6;
      --el-color-primary-light-7: #9cd5ce;
      --el-color-primary-light-8: #b1dfda;
      --el-color-primary-light-9: #c6e9e5;
      --el-color-primary-dark-2: #0a766b;
    }

    html.dark {
      --accent: #14b8a6;
      --accent-strong: #2dd4bf;
      --accent-soft: #134e4a;
      --accent-soft-2: #0f2e2c;

      --app-bg: #0b1220;
      --surface: #111827;
      --surface-2: #0f172a;
      --border: #1f2937;
      --border-2: #263043;
      --text-1: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #64748b;

      --shadow-sm: 0 1px 2px rgba(0,0,0,.28);
      --shadow-md: 0 8px 22px rgba(0,0,0,.35);

      --el-bg-color: #111827;
      --el-bg-color-overlay: #1f2937;
      --el-fill-color-blank: #111827;
      --el-fill-color-light: #1f2937;
      --el-border-color: #263043;
      --el-border-color-light: #263043;
      --el-border-color-lighter: #1f2937;
      --el-text-color-primary: #f1f5f9;
      --el-text-color-regular: #cbd5e1;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--app-bg);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .mono { font-family: var(--font-mono); }
    [v-cloak] { display: none; }

    .login-wrap { min-height: 100vh; display: flex; background: var(--surface); }
    .login-brand {
      flex: 0 0 44%;
      background: radial-gradient(1200px 600px at -10% -10%, #134e4a 0%, transparent 55%),
                  radial-gradient(900px 500px at 110% 110%, #0e2a3a 0%, transparent 55%),
                  var(--sb-bg);
      color: #f1f5f9;
      padding: 56px 56px 48px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .login-brand::after {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-mask-image: radial-gradient(800px 500px at 30% 20%, #000 0%, transparent 70%);
      mask-image: radial-gradient(800px 500px at 30% 20%, #000 0%, transparent 70%);
      pointer-events: none;
    }
    .brand-mark { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
    .brand-mark .logo {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(20,184,166,.35);
      flex: none;
    }
    .brand-mark .logo svg { width: 22px; height: 22px; }
    .brand-name { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
    .brand-name span { color: #14b8a6; }
    .brand-hero { margin-top: auto; position: relative; z-index: 1; }
    .brand-hero h1 { font-size: 34px; line-height: 1.3; font-weight: 700; margin: 0 0 14px; letter-spacing: .3px; }
    .brand-hero p { font-size: 15px; line-height: 1.7; color: #94a3b8; margin: 0 0 32px; max-width: 40ch; }
    .brand-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
    .brand-points li { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; color: #cbd5e1; }
    .brand-points .dot {
      width: 22px; height: 22px; border-radius: 7px; flex: none; margin-top: 1px;
      background: rgba(20,184,166,.14); color: #2dd4bf;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-foot { position: relative; z-index: 1; margin-top: 48px; font-size: 12px; color: #64748b; }

    .login-form-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .login-form-card { width: 100%; max-width: 380px; }
    .login-form-card h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: .2px; }
    .login-form-card .sub { color: var(--text-3); font-size: 14px; margin: 0 0 32px; }
    .login-form-card .el-form-item { margin-bottom: 22px; }
    .login-actions { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 26px; }
    .login-btn { width: 100%; height: 44px; font-size: 15px; font-weight: 600; letter-spacing: 2px; }
    .login-links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13px; }

    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 236px; flex: none; background: var(--sb-bg);
      display: flex; flex-direction: column;
      transition: width .2s cubic-bezier(.4,0,.2,1);
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar.collapsed { width: 64px; }
    .sb-head {
      height: 56px; display: flex; align-items: center; gap: 11px;
      padding: 0 16px; border-bottom: 1px solid var(--sb-border); flex: none;
    }
    .sb-head .logo {
      width: 30px; height: 30px; border-radius: 8px; flex: none;
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      display: flex; align-items: center; justify-content: center;
    }
    .sb-head .logo svg { width: 18px; height: 18px; }
    .sb-head .name { color: #f1f5f9; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; }
    .sb-head .name span { color: #14b8a6; }

    .sb-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
    .sb-nav::-webkit-scrollbar { width: 0; }
    .sb-group { margin-bottom: 2px; }
    .sb-item {
      display: flex; align-items: center; gap: 12px;
      height: 40px; padding: 0 12px; border-radius: 8px;
      color: var(--sb-text); cursor: pointer; font-size: 14px;
      transition: background .15s, color .15s; user-select: none;
    }
    .sb-item:hover { background: rgba(255,255,255,.05); color: var(--sb-text-hover); }
    .sb-item.active { background: rgba(20,184,166,.13); color: var(--sb-text-active); }
    .sb-item.active .sb-ico { color: #2dd4bf; }
    .sb-item .sb-ico { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; }
    .sb-item .sb-label { flex: 1; white-space: nowrap; overflow: hidden; }
    .sb-item .arrow { transition: transform .2s; color: var(--sb-text); }
    .sb-item .arrow.open { transform: rotate(90deg); }
    .sb-sub { overflow: hidden; }
    .sb-sub-item {
      display: flex; align-items: center; gap: 12px; height: 36px;
      padding: 0 12px 0 44px; border-radius: 8px;
      color: var(--sb-text); cursor: pointer; font-size: 13px;
    }
    .sb-sub-item:hover { color: var(--sb-text-hover); }
    .sb-sub-item.active { color: #2dd4bf; background: rgba(20,184,166,.1); }
    .sb-sub-item .bar { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .5; flex: none; }

    .sidebar.collapsed .sb-head { padding: 0 17px; }
    .sidebar.collapsed .sb-head .name,
    .sidebar.collapsed .sb-item .sb-label,
    .sidebar.collapsed .sb-item .arrow,
    .sidebar.collapsed .sb-sub { display: none; }
    .sidebar.collapsed .sb-item { justify-content: center; padding: 0; }

    .sb-foot { flex: none; padding: 12px 10px; border-top: 1px solid var(--sb-border); }
    .sb-foot .sb-item { color: var(--sb-text); }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header {
      height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-title .crumb { color: var(--text-3); font-weight: 400; margin-right: 8px; }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .hdr-btn {
      height: 34px; min-width: 34px; padding: 0 8px; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      color: var(--text-2); font-size: 13px; border: none; background: transparent;
    }
    .hdr-btn:hover { background: var(--surface-2); color: var(--text-1); }
    .hdr-btn .el-icon { font-size: 16px; }
    .proj-switch {
      height: 34px; display: inline-flex; align-items: center; gap: 8px;
      padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text-1); cursor: pointer; background: var(--surface);
    }
    .proj-switch:hover { border-color: var(--accent); }
    .proj-switch .divider { width: 1px; height: 16px; background: var(--border); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .content { flex: 1; padding: 20px; max-width: 1500px; width: 100%; margin: 0 auto; }

    .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .page-head h2 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .page-head .desc { color: var(--text-3); font-size: 13px; margin-top: 4px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }

    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 12px;
    }
    .stat-top { display: flex; align-items: center; justify-content: space-between; }
    .stat-ico {
      width: 36px; height: 36px; border-radius: 9px;
      background: var(--accent-soft-2); color: var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: .5px; font-family: var(--font-mono); line-height: 1; }
    .stat-label { color: var(--text-3); font-size: 13px; }
    .delta { font-size: 12px; display: inline-flex; align-items: center; gap: 3px; font-weight: 600; }
    .delta.up { color: #16a34a; }
    .delta.down { color: #dc2626; }

    .home-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border-2);
    }
    .panel-head .t { font-size: 14px; font-weight: 600; }
    .panel-body { padding: 8px 10px; }

    .todo-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 8px;
      cursor: pointer; transition: background .12s;
    }
    .todo-item:hover { background: var(--surface-2); }
    .todo-item .tk { flex: 1; min-width: 0; }
    .todo-item .tk .ti { font-size: 13px; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .todo-item .tk .tm { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .tag-pill { font-size: 12px; padding: 2px 8px; border-radius: 6px; line-height: 1.6; flex: none; }

    .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
    .case-layout { display: grid; grid-template-columns: 232px 1fr; gap: 16px; margin-top: 16px; }
    .tree-panel { padding: 10px; }
    .tree-title { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 8px 10px; }

    .split-col { display: grid; grid-template-columns: 250px 1fr; gap: 0; margin-top: 16px; }
    .req-col { border-right: 1px solid var(--border-2); }
    .req-list-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-2); }
    .req-list-item:hover { background: var(--surface-2); }
    .req-list-item.active { background: var(--accent-soft-2); border-left: 2px solid var(--accent); }
    .req-list-item .m { font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
    .req-list-item .n { font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .http-bar { display: flex; gap: 8px; padding: 14px 16px; align-items: center; }
    .http-bar .el-select { width: 116px; flex: none; }
    .http-bar .el-input { flex: 1; }
    .resp-status { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border-2); font-size: 13px; }
    .status-code { font-family: var(--font-mono); font-weight: 700; padding: 2px 9px; border-radius: 6px; }
    .status-code.ok { background: #dcfce7; color: #15803d; }
    html.dark .status-code.ok { background: #052e1b; color: #4ade80; }
    .meta-kv { color: var(--text-3); font-size: 12px; }
    .meta-kv b { color: var(--text-2); font-weight: 600; margin-right: 3px; }
    .code-block {
      margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7;
      color: var(--text-2); background: var(--surface-2); border-radius: 0; overflow: auto;
    }
    .code-block .k { color: #0d9488; }
    .code-block .s { color: #16a34a; }
    .code-block .n { color: #2563eb; }
    html.dark .code-block .k { color: #2dd4bf; }
    html.dark .code-block .s { color: #4ade80; }
    html.dark .code-block .n { color: #60a5fa; }

    .kv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .kv-table th, .kv-table td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--border-2); }
    .kv-table th { color: var(--text-3); font-weight: 500; font-size: 12px; }

    .placeholder-body { padding: 80px 24px; text-align: center; color: var(--text-3); }
    .placeholder-body .big { font-size: 40px; margin-bottom: 12px; }
    .placeholder-body .t { font-size: 16px; color: var(--text-2); font-weight: 600; }
    .placeholder-body .s { font-size: 13px; margin-top: 6px; }

    .empty-tip { padding: 30px; text-align: center; color: var(--text-3); font-size: 13px; }

    @media (max-width: 1080px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .home-grid { grid-template-columns: 1fr; }
      .case-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) {
      .login-brand { display: none; }
    }
  </style>
</head>

<body>
  <div id="app" v-cloak></div>

  <script type="text/x-template" id="appTemplate">
    <!-- ==================== 登录页 ==================== -->
    <div v-if="!loggedIn" class="login-wrap">
      <div class="login-brand">
        <div class="brand-mark">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 3h6"></path><path d="M10 3v5.5L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8.5V3"></path>
              <path d="M7.5 14.5h9"></path>
            </svg>
          </div>
          <div class="brand-name">Test<span>Engine</span></div>
        </div>
        <div class="brand-hero">
          <h1>统一的测试管理与<br>接口自动化平台</h1>
          <p>用例、接口、场景、计划与缺陷在同一平台内闭环，把测试能力纳入持续交付体系。</p>
          <ul class="brand-points">
            <li><span class="dot"><el-icon><Tickets></Tickets></el-icon></span>功能用例列表与脑图双模式沉淀测试资产</li>
            <li><span class="dot"><el-icon><Connection></Connection></el-icon></span>接口调试、定义、Mock 与场景编排一体化</li>
            <li><span class="dot"><el-icon><DataLine></DataLine></el-icon></span>测试计划汇总结果，产出可分享的质量报告</li>
          </ul>
        </div>
        <div class="brand-foot">TestEngine 持续测试平台 · 前端静态预览</div>
      </div>

      <div class="login-form-panel">
        <div class="login-form-card">
          <h2>欢迎回来</h2>
          <p class="sub">登录后进入你的测试工作台</p>
          <el-form @submit.prevent="login">
            <el-form-item>
              <el-input v-model="loginForm.account" size="large" placeholder="账号" clearable>
                <template #prefix><el-icon><User></User></el-icon></template>
              </el-input>
            </el-form-item>
            <el-form-item>
              <el-input v-model="loginForm.password" size="large" type="password" placeholder="密码" show-password>
                <template #prefix><el-icon><Lock></Lock></el-icon></template>
              </el-input>
            </el-form-item>
            <div class="login-actions">
              <el-checkbox v-model="loginForm.remember">记住我</el-checkbox>
              <el-link type="primary" :underline="false">忘记密码</el-link>
            </div>
            <el-button type="primary" class="login-btn" @click="login">登 录</el-button>
          </el-form>
          <div class="login-links">
            <span class="meta-kv">还没有账号？<el-link type="primary" :underline="false">注册</el-link></span>
            <span class="meta-kv">v0.1 预览</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== 主布局 ==================== -->
    <div v-else class="shell">
      <aside class="sidebar" :class="{ collapsed }">
        <div class="sb-head">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 3h6"></path><path d="M10 3v5.5L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8.5V3"></path>
              <path d="M7.5 14.5h9"></path>
            </svg>
          </div>
          <div class="name">Test<span>Engine</span></div>
        </div>

        <nav class="sb-nav">
          <template v-for="m in menus" :key="m.key">
            <div v-if="m.children" class="sb-group">
              <div class="sb-item" :class="{ active: isParentActive(m) }" @click="toggleMenu(m.key)">
                <span class="sb-ico"><el-icon><component :is="m.icon"></component></el-icon></span>
                <span class="sb-label">{{ m.label }}</span>
                <el-icon class="arrow" :class="{ open: openMenus.includes(m.key) }"><ArrowRight></ArrowRight></el-icon>
              </div>
              <div v-show="openMenus.includes(m.key)" class="sb-sub">
                <div v-for="c in m.children" :key="c.key"
                     class="sb-sub-item" :class="{ active: activeMenu === c.key }"
                     @click="go(c)">
                  <span class="bar"></span><span class="sb-label">{{ c.label }}</span>
                </div>
              </div>
            </div>
            <div v-else class="sb-group">
              <div class="sb-item" :class="{ active: activeMenu === m.key }" @click="go(m)">
                <span class="sb-ico"><el-icon><component :is="m.icon"></component></el-icon></span>
                <span class="sb-label">{{ m.label }}</span>
              </div>
            </div>
          </template>
        </nav>

        <div class="sb-foot">
          <div class="sb-item" @click="collapsed = !collapsed">
            <span class="sb-ico"><el-icon><Fold v-if="!collapsed"></Fold><Expand v-else></Expand></el-icon></span>
            <span class="sb-label">收起菜单</span>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="header">
          <div class="header-left">
            <div class="header-title">
              <span class="crumb">{{ currentBreadcrumb }}</span>{{ currentTitle }}
            </div>
          </div>
          <div class="header-right">

        onMounted(() => { applyTheme(); });

        return {
          isDark, collapsed, loggedIn, currentView, activeMenu, timeRange, openMenus,
          currentTitle, currentBreadcrumb, loginForm, user, userInitial, menus,
          toggleMenu, go, toggleTheme, onLang, onProj, onUser, login, logout, isParentActive,
          stats, todos, tagStyle,
          caseKeyword, caseLevel, caseStatus, moduleTree, filteredCases, statusType,
          methods, req, reqTab, respTab,
        };
      },
    };

    const app = createApp(App);
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
    for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
